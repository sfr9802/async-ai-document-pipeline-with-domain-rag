services:
  weaviate-source-atom-nonprod:
    image: cr.weaviate.io/semitechnologies/weaviate:1.38.0
    container_name: aipipeline-weaviate-source-atom-nonprod
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --scheme
      - http
    restart: on-failure:0
    ports:
      - "${WEAVIATE_HTTP_PORT:-8080}:8080"
      - "${WEAVIATE_GRPC_PORT:-50051}:50051"
    volumes:
      - type: bind
        source: ${WEAVIATE_NONPROD_DATA_PATH:-./output/weaviate-source-atom-nonprod}
        target: /var/lib/weaviate
    environment:
      QUERY_DEFAULTS_LIMIT: "25"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: "none"
      CLUSTER_HOSTNAME: node1
      ENABLE_MODULES: ""
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
