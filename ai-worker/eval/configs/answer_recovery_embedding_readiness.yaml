schema_version: answer_recovery_embedding_readiness_config_v1
mode: diagnostic_only_embedding_readiness
description: >
  Report-only/staging readiness analysis for answer recovery embedding work.
  This step inspects source chunk provenance, existing local embedding/index
  conventions, and leakage guardrails. It does not promote answer-recovery
  policy, open official answer denominators, mutate production indexes, embed
  expected answers or labels, train on frozen gold, or make diagnostic-only
  evidence support-eligible.

inputs:
  safe_recall_tuning_report: ai-worker/eval/reports/rag-ingestion/answer_recovery_safe_recall_tuning_report.json
  safe_recall_selected_policy: ai-worker/eval/reports/rag-ingestion/answer_recovery_safe_recall_selected_policy.json
  safe_recall_variants_csv: ai-worker/eval/reports/rag-ingestion/answer_recovery_safe_recall_variants.csv
  missed_safe_recovery_analysis: ai-worker/eval/reports/rag-ingestion/answer_recovery_missed_safe_recovery_analysis.json
  missed_row_triage: ai-worker/eval/reports/rag-ingestion/answer_recovery_safe_recall_missed_row_triage.json
  answer_recovery_expanded_trace: ai-worker/eval/reports/rag-ingestion/answer_recovery_expanded_trace.jsonl
  answer_sufficiency_expanded_report: ai-worker/eval/reports/rag-ingestion/answer_sufficiency_expanded_diagnostic_report.json

source_artifact_inspection:
  enabled: true
  allow_eval_artifact_text_as_embedding_source: false
  allowed_source_text_files:
    - ai-worker/eval/indexes/namu-v4-2008-2026-04-retrieval-title-section-mseq512/chunks.jsonl
  source_csv_lookup_enabled: true
  note: >
    CSV evidence quotes may be used only to find canonical source IDs and
    provenance metadata. They are not embedded unless the same source text is
    independently present in an allowed source-text artifact.

embedding_backend:
  provider_config_files:
    - ai-worker/app/core/config.py
    - ai-worker/app/capabilities/rag/embeddings.py
  vector_index_files:
    - ai-worker/app/capabilities/rag/faiss_index.py
  index_root: ai-worker/eval/indexes
  staging_namespace: diagnostic_answer_recovery_embedding_readiness_v1
  required_env_vars: []
  env_presence_vars:
    - AIPIPELINE_WORKER_RAG_EMBEDDING_MODEL
    - AIPIPELINE_WORKER_RAG_EMBEDDING_PREFIX_QUERY
    - AIPIPELINE_WORKER_RAG_EMBEDDING_PREFIX_PASSAGE
    - AIPIPELINE_WORKER_RAG_EMBEDDING_MAX_SEQ_LENGTH
    - AIPIPELINE_WORKER_RAG_EMBEDDING_BATCH_SIZE
    - AIPIPELINE_WORKER_RAG_EMBEDDING_CUDA_ALLOC_CONF
    - AIPIPELINE_WORKER_RAG_INDEX_DIR
  allow_backend_probe_embedding: true
  perform_staging_backfill: false
  allow_vector_write: false
  staging_backfill_status_when_skipped: skipped_backfill_disabled_by_config
  require_existing_staging_namespace_for_backfill: true
  namespace_safety:
    required_prefixes:
      - diagnostic_
      - staging_
    allowed_markers:
      - diagnostic
      - staging
    forbidden_markers:
      - production
      - prod
      - live
      - serving
      - current

excluded_frozen_gold_ids:
  source_files:
    - ai-worker/eval/review/gold_silver_tuning/text_gold_main_positive_clean.csv
    - ai-worker/eval/review/gold_silver_tuning/text_gold_abstain_diagnostic_clean.csv
    - ai-worker/eval/review/gold_silver_tuning/pdf_file_lookup_gold_positive_clean.csv
    - ai-worker/eval/review/gold_silver_tuning/pdf_file_lookup_diagnostic_clean.csv
  use_for_selection: false
  use_for_training: false

manifest_classifications:
  - EMBED_STAGING_PRODUCTION_ELIGIBLE_SOURCE
  - SKIP_HIDDEN_XLSX
  - SKIP_DIAGNOSTIC_ONLY_SHADOW
  - SKIP_PDF_FILE_CONTENT_MIXING_RISK
  - SKIP_FROZEN_GOLD_DERIVED_EVAL_CONTENT
  - SKIP_EXPECTED_ANSWER_OR_LABEL
  - SKIP_SOURCE_NOT_FOUND
  - SKIP_CANONICAL_LINK_MISSING
  - SKIP_POLICY_BLOCKED
  - REVIEW_GOLD_POLICY_REQUIRED

guardrail_assertions:
  wrongly_supported_count: 0
  hidden_xlsx_support_eligible_count: 0
  pdf_file_content_mixing_support_eligible_count: 0
  diagnostic_only_support_eligible_count: 0
  expected_answer_or_label_embedding_count: 0
  official_denominator_registry_changed: false
  official_answer_denominator_opened: false
  production_index_mutation: false
  broad_indexing: false
  frozen_gold_training_rows: 0
  frozen_gold_profile_selection: false
  production_promotion_ready: false
  official_answer_denominator_ready: false
  pdf_file_lookup_semantics: file_identity_only
  pdf_file_content_support: false
  hidden_xlsx_content_support: false
  diagnostic_only_evidence_support: false
  native_pdf_text_outranks_ocr_fallback: true

local_llm:
  enabled: false
  allowed_only_for: diagnostic_summarization_or_failure_reason_drafting
  may_decide_answer_correctness: false
  may_decide_evidence_support: false
  may_decide_relevance: false
  may_decide_answerability: false
  may_decide_gold_labels: false
  may_decide_expected_answers: false
  may_decide_expected_evidence: false

optuna:
  enabled: false
  reason: embedding readiness is provenance/index-scope diagnostic, not parameter optimization

report_paths:
  readiness_md: ai-worker/eval/reports/rag-ingestion/answer_recovery_embedding_readiness.md
  readiness_json: ai-worker/eval/reports/rag-ingestion/answer_recovery_embedding_readiness.json
  readiness_csv: ai-worker/eval/reports/rag-ingestion/answer_recovery_embedding_readiness.csv
  backend_contract_md: ai-worker/eval/reports/rag-ingestion/answer_recovery_embedding_backend_contract_recheck.md
  backend_contract_json: ai-worker/eval/reports/rag-ingestion/answer_recovery_embedding_backend_contract_recheck.json
  backend_contract_csv: ai-worker/eval/reports/rag-ingestion/answer_recovery_embedding_backend_contract_recheck.csv
  existing_embedding_retrieval_probe_md: ai-worker/eval/reports/rag-ingestion/answer_recovery_existing_embedding_retrieval_probe.md
  existing_embedding_retrieval_probe_json: ai-worker/eval/reports/rag-ingestion/answer_recovery_existing_embedding_retrieval_probe.json
  existing_embedding_retrieval_probe_csv: ai-worker/eval/reports/rag-ingestion/answer_recovery_existing_embedding_retrieval_probe.csv
  backfill_manifest_jsonl: ai-worker/eval/reports/rag-ingestion/answer_recovery_embedding_backfill_manifest.jsonl
  namespace_inventory_json: ai-worker/eval/reports/rag-ingestion/answer_recovery_embedding_namespace_inventory.json

reporting:
  artifact_profile: compact
  compact_report_basename: answer_recovery_tuning_report
  emit_human_report: true
  emit_machine_report: true
  emit_stage_reports: false
  emit_csv: false
  emit_row_manifest: false
  emit_namespace_inventory: false
  emit_debug_artifacts: false
  emit_debug_artifacts_on_failure: true
  clean_legacy_stage_artifacts_on_compact_run: true
