schema_version: answer_recovery_fresh_diagnostic_candidate_discovery_config_v1
mode: diagnostic_only_fresh_candidate_discovery
description: >
  Report-only discovery of fresh non-frozen answer-recovery diagnostic rows for
  later human review. This config does not create official gold, does not open
  answer denominators, does not mutate indexes, and does not write vectors.

inputs:
  compact_tuning_report: ai-worker/eval/reports/rag-ingestion/answer_recovery_tuning_report.json
  missed_row_triage: ai-worker/eval/reports/rag-ingestion/answer_recovery_safe_recall_missed_row_triage.json
  answer_recovery_expanded_trace: ai-worker/eval/reports/rag-ingestion/answer_recovery_expanded_trace.jsonl
  answer_sufficiency_expanded_report: ai-worker/eval/reports/rag-ingestion/answer_sufficiency_expanded_diagnostic_report.json
  silver_manifest: ai-worker/eval/review/gold_silver_tuning/silver_manifest.csv
  official_denominator_registry: ai-worker/eval/eval_queries/official_denominator_registry.json

excluded_frozen_gold_ids:
  source_files:
    - ai-worker/eval/review/gold_silver_tuning/text_gold_main_positive_clean.csv
    - ai-worker/eval/review/gold_silver_tuning/text_gold_abstain_diagnostic_clean.csv
    - ai-worker/eval/review/gold_silver_tuning/pdf_file_lookup_gold_positive_clean.csv
    - ai-worker/eval/review/gold_silver_tuning/pdf_file_lookup_diagnostic_clean.csv
  use_for_selection: false
  use_for_training: false

source_content_policy:
  allow_silver_tuning_only_sources: true
  allow_expected_answer_as_surface: false
  allow_label_as_surface: false
  allow_hidden_xlsx: false
  allow_pdf_file_content_support: false
  allow_diagnostic_only_support: false

guardrail_assertions:
  official_denominator_registry_changed: false
  official_answer_denominator_opened: false
  production_index_mutation: false
  broad_indexing: false
  vector_write_attempted: false
  namespace_created: false
  frozen_gold_training_rows: 0
  frozen_gold_profile_selection: false
  expected_answer_or_label_embedding_count: 0
  hidden_xlsx_support_eligible_count: 0
  pdf_file_content_mixing_support_eligible_count: 0
  diagnostic_only_support_eligible_count: 0
  production_promotion_ready: false
  official_answer_denominator_ready: false
  promotion_evidence: false
  per_trial_llm_steering: false
  llm_as_objective: false
  mid_round_search_space_mutation: false
  raw_data_exposed_to_llm_analyst: false

report_paths:
  discovery_md: ai-worker/eval/reports/rag-ingestion/answer_recovery_fresh_diagnostic_candidate_discovery.md
  discovery_json: ai-worker/eval/reports/rag-ingestion/answer_recovery_fresh_diagnostic_candidate_discovery.json
  review_pack_csv: ai-worker/eval/review/answer_recovery/answer_recovery_fresh_diagnostic_candidate_review_pack.csv
