lane_names:
  - TEXT
  - XLSX
  - PDF_CONTENT
  - PDF_FILE_LOOKUP
  - OCR_SHADOW
  - IDP_SHADOW
  - MULTIMODAL_SHADOW

allowed_calibration_knobs:
  support_score_threshold: [0.0, 0.75, 0.85]
  citation_coverage_threshold: [1.0]
  needs_recovery_vs_unsupported_boundary:
    - keep_current_fail_closed
    - retry_uncited_diagnostic_only
  needs_clarification_routing_threshold:
    - current_ambiguous_or_missing_identity
  pdf_file_identity_exactness_rule:
    - exact_or_canonical_identity_required
  max_loop_iterations: 2
  max_query_rewrites: 3

blocked_knobs:
  production_profile_changes: true
  official_denominator_changes: true
  broad_indexing: true
  frozen_gold_selection_or_training: true
  ocr_idp_multimodal_promotion: true
  pdf_file_content_page_bbox_table_row_column_value_success_claims: true

variants:
  - name: calibrated_identity_exact_v1
    support_score_threshold: 0.0
    citation_coverage_threshold: 1.0
    needs_recovery_vs_unsupported_boundary: keep_current_fail_closed
    needs_clarification_routing_threshold: current_ambiguous_or_missing_identity
    pdf_file_identity_exactness_rule: exact_or_canonical_identity_required
  - name: strict_support_score_0_85
    support_score_threshold: 0.85
    citation_coverage_threshold: 1.0
    pdf_file_identity_exactness_rule: exact_or_canonical_identity_required
  - name: retry_uncited_diagnostic_only
    support_score_threshold: 0.0
    citation_coverage_threshold: 1.0
    needs_recovery_vs_unsupported_boundary: retry_uncited_diagnostic_only
    pdf_file_identity_exactness_rule: exact_or_canonical_identity_required
  - name: unsafe_pdf_file_token_overlap_support
    support_score_threshold: 0.0
    citation_coverage_threshold: 1.0
    pdf_file_identity_exactness_rule: filename_token_overlap_allowed
  - name: unsafe_hidden_xlsx_support
    support_score_threshold: 0.0
    citation_coverage_threshold: 1.0
    hidden_xlsx_blocking: disabled
  - name: unsafe_diagnostic_only_support
    support_score_threshold: 0.0
    citation_coverage_threshold: 1.0
    diagnostic_only_support: enabled

report_paths:
  calibration_report_md: ai-worker/eval/reports/rag-ingestion/answer_recovery_narrow_calibration_report.md
  calibration_report_json: ai-worker/eval/reports/rag-ingestion/answer_recovery_narrow_calibration_report.json
  variants_csv: ai-worker/eval/reports/rag-ingestion/answer_recovery_narrow_calibration_variants.csv
  selected_policy_json: ai-worker/eval/reports/rag-ingestion/answer_recovery_narrow_calibration_selected_policy.json

guardrail_assertions:
  official_denominator_registry_changed: false
  official_answer_denominator_opened: false
  production_index_mutation: false
  broad_indexing: false
  frozen_gold_training_rows: 0
  frozen_gold_profile_selection: false
  tuned_text_section_boost_bm25_promotion_status: diagnostic_only
  ocr_idp_multimodal_denominator_role: DIAGNOSTIC_ONLY
  native_pdf_text_outranks_ocr_fallback: true
  pdf_file_lookup_semantics: file_identity_only
  pdf_file_lookup_success_claims:
    content: false
    page: false
    bbox: false
    table: false
    row: false
    column: false
    value: false
  production_promotion_ready: false
  official_answer_denominator_ready: false
