schema_version: answer_recovery_narrow_silver_calibration_config_v1
mode: diagnostic_only_narrow_silver_calibration
description: >
  Report-only answer recovery calibration over existing silver/reviewed
  diagnostic artifacts. This config does not open official answer denominators,
  does not train on frozen gold, and does not mutate production indexes.

silver_only_diagnostic_inputs:
  text:
    - ai-worker/eval/review/gold_silver_tuning/silver_text_positive_train.csv
    - ai-worker/eval/review/gold_silver_tuning/silver_text_hard_negative_train.csv
    - ai-worker/eval/review/gold_silver_tuning/silver_text_abstain_diagnostic.csv
  pdf_file_lookup:
    - ai-worker/eval/review/gold_silver_tuning/silver_pdf_file_lookup_positive_train.csv
    - ai-worker/eval/review/gold_silver_tuning/silver_pdf_file_lookup_hard_negative_v2.csv
  diagnostic_shadow:
    - ai-worker/eval/reports/rag-ingestion/ocr_shadow_small_sample_report.json
    - ai-worker/eval/reports/rag-ingestion/idp_shadow_small_sample_report.json
    - ai-worker/eval/reports/rag-ingestion/multimodal_shadow_small_sample_report.json
  answer_recovery_expanded_input:
    - ai-worker/eval/reports/rag-ingestion/answer_sufficiency_expanded_diagnostic_report.json
    - ai-worker/eval/reports/rag-ingestion/answer_recovery_expanded_trace.jsonl

excluded_frozen_gold_ids:
  source_files:
    - ai-worker/eval/review/gold_silver_tuning/text_gold_main_positive_clean.csv
    - ai-worker/eval/review/gold_silver_tuning/text_gold_abstain_diagnostic_clean.csv
    - ai-worker/eval/review/gold_silver_tuning/pdf_file_lookup_gold_positive_clean.csv
    - ai-worker/eval/review/gold_silver_tuning/pdf_file_lookup_diagnostic_clean.csv
