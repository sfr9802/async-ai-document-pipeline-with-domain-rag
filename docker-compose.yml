# Infra-only local development stack.
#
# Default local infra starts both postgres and redis:
#
#     docker compose up -d
#
# Postgres listens on host :5433 to avoid colliding with another local
# postgres that may already own :5432. Override the app DSNs from .env.example
# if you want to point the apps at an external postgres instead.
#
# Neither mode starts core-api or ai — those stay as local processes
# in phase 1 so debugging stays cheap.
#
# Container names are prefixed with `aipipeline-` to avoid collision with
# other dev stacks on the same host.

services:

  redis:
    image: redis:latest
    container_name: aipipeline-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - aipipeline-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:18
    container_name: aipipeline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aipipeline
      POSTGRES_PASSWORD: aipipeline_pw
      POSTGRES_DB: aipipeline
    ports:
      - "5433:5432"                    # host 5433 → container 5432
    volumes:
      - aipipeline-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aipipeline -d aipipeline"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: aipipeline-minio
    restart: unless-stopped
    profiles: ["minio"]                # opt-in; phase 2 storage backend
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: aipipeline
      MINIO_ROOT_PASSWORD: aipipeline_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - aipipeline-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-bootstrap:
    image: minio/mc:latest
    container_name: aipipeline-minio-bootstrap
    profiles: ["minio"]
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 2 &&
      mc alias set local http://minio:9000 aipipeline aipipeline_secret &&
      mc mb --ignore-existing local/aipipeline-artifacts &&
      echo 'Bucket aipipeline-artifacts ready'
      "
    restart: "no"

  # Local LLM stack (phase 4+). Opt-in: only started when the "llm"
  # profile is selected, so CPU-only dev machines that don't want a
  # resident model can skip it entirely.
  #
  #   docker compose --profile llm up -d
  #
  # Gemma 4 E2B runs from local GGUF files through llama.cpp's
  # OpenAI-compatible API. The sibling mmproj file is mounted too, so
  # image inputs work for MULTIMODAL vision without using Ollama.
  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b8840
    container_name: aipipeline-llama-cpp-gemma4
    restart: unless-stopped
    profiles: ["llm"]
    ports:
      - "${AIPIPELINE_LLAMACPP_BIND_HOST:-127.0.0.1}:${AIPIPELINE_LLAMACPP_PORT:-8081}:8080"
    volumes:
      - type: bind
        source: ${AIPIPELINE_LLAMACPP_MODEL_DIR:-C:/llm/gguf/gemma-4-e2b-it-gguf}
        target: /models/gemma4-e2b
        read_only: true
    command:
      - --model
      - /models/gemma4-e2b/gemma-4-e2b-it-edited-q4_0.gguf
      - --mmproj
      - /models/gemma4-e2b/mmproj-gemma-4-e2b-it-q4_0.gguf
      - --alias
      - gemma4-e2b-local
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "${AIPIPELINE_LLAMACPP_CTX_SIZE:-8192}"
      - --cache-type-k
      - "${AIPIPELINE_LLAMACPP_CACHE_TYPE_K:-f16}"
      - --cache-type-v
      - "${AIPIPELINE_LLAMACPP_CACHE_TYPE_V:-f16}"
      - --n-gpu-layers
      - "${AIPIPELINE_LLAMACPP_GPU_LAYERS:-99}"
      - --jinja
      - --reasoning
      - "off"
      - --image-min-tokens
      - "${AIPIPELINE_LLAMACPP_IMAGE_TOKENS:-280}"
      - --image-max-tokens
      - "${AIPIPELINE_LLAMACPP_IMAGE_TOKENS:-280}"
      - --metrics
      - --props
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  aipipeline-redis-data:
  aipipeline-postgres-data:
  aipipeline-minio-data:
