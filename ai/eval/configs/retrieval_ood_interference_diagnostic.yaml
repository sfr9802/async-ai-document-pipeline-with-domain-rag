schema_version: retrieval_ood_interference_diagnostic_config_v1
run_id: retrieval_ood_interference_diagnostic_20260510

policy:
  diagnostic_report_only: true
  mutate_production_indexes: false
  production_index_mutation: false
  production_vector_writes: false
  broad_unscoped_indexing: false
  official_denominator_registry_changed: false
  hidden_xlsx_content_previews: false
  use_frozen_gold_for_profile_selection: false
  use_expected_answers_or_labels_as_embedding_text: false
  run_optuna: false
  use_llm_for_labels_or_judgments: false
  pdf_file_lookup_policy: file_identity_only
  pdf_file_lookup_claims_content_page_bbox_table_row_column_value_success: false

prerequisites:
  phase0_local_resource_preflight: ai/eval/reports/rag-ingestion/retrieval_local_resource_preflight.json
  phase1_corpus_diversity_profile: ai/eval/reports/rag-ingestion/retrieval_corpus_diversity_profile.json

diagnostic_namespace:
  required: false
  name: diagnostic_retrieval_ood_interference_v1
  production_index_mutation: false
  vector_write_attempted: false
  cleanup_required: false

postgres:
  host: 127.0.0.1
  port: 5433
  database: aipipeline
  user: aipipeline
  password: aipipeline_pw
  connect_timeout_seconds: 5

splits:
  random_seed: 9802
  random_holdout_modulo: 5
  max_groups_per_type: 8
  main_metric_split_types:
    - leave_document_family_out
    - leave_template_or_table_shape_out
    - leave_parser_version_out
    - leave_source_artifact_out
    - file_identity_confusion_split
    - lane_cross_eval
  random_row_split_diagnostic_baseline_only: true

interference:
  scoring_method: in_memory_shadow_token_vector
  top_k: 10
  max_same_lane_distractors: 80
  max_cross_lane_distractors: 120
  max_safe_distractors: 80
  max_near_duplicate_distractors: 2
  conditions:
    - A_baseline_corpus_only
    - B_baseline_plus_safe_distractor_corpus
    - C_baseline_plus_same_lane_hard_negatives
    - D_baseline_plus_cross_lane_distractors
    - E_baseline_plus_near_duplicate_metadata_file_name_distractors

diagnostic_source_contract:
  PDF_CONTENT:
    target_sources:
      - DART_PDF
      - PUBLIC_INSTITUTION_PDF
      - LOCAL_GOVERNMENT_PDF
      - INTERNAL_REPORT_PDF
    positive_policy: content_evidence_only
    hard_negative_policy: keep_file_identity_confusions_out_of_pdf_content_success
  XLSX:
    target_sources:
      - PUBLIC_DATA_PORTAL_XLSX
      - KOSIS_EXCEL
      - LOCAL_GOVERNMENT_STATISTICAL_YEARBOOK_EXCEL
      - INTERNAL_WORK_EXCEL
    positive_policy: retrieval_selected_visible_table_content_only
    hard_negative_policy: preserve_hidden_redaction_and_table_shape_confusions
  PDF_FILE_IDENTITY:
    target_sources:
      - DART_PDF
      - PUBLIC_INSTITUTION_PDF
      - STATISTICAL_YEARBOOK_PDF
    positive_policy: exact_or_canonical_file_identity_only
    hard_negative_policy: year_version_and_similar_filename_confusions
  TEXT_NAMU:
    target_sources:
      - NAMU_NEAR_DUPLICATE_METADATA
    positive_policy: no_general_positive_expansion_for_this_diagnostic
    hard_negative_policy: near_duplicate_metadata_hard_negative_without_query_echo

lanes:
  - name: TEXT_NAMU
    query_sources:
      - role: official_text_namu_v4
        path: ai/eval/eval_queries/gold_queries_text_namu_v4_v0.csv
    chunk_sources:
      - type: jsonl
        path: ai/eval/corpora/namu-v4-structured-combined/rag_chunks.jsonl
        text_fields: [chunk_text, text]
        embedding_text_fields: [embedding_text]
        source_document_fields: [doc_id]
        document_family_fields: [title, display_title, retrieval_title]
        source_artifact_fields: [doc_id]
        parser_version_fields: [parser_version]

  - name: XLSX
    hidden_xlsx_redaction: true
    query_sources:
      - role: official_xlsx_positive_retrieval_v0
        path: ai/eval/eval_queries/gold_queries_xlsx_human_review_official_positive_v0_retrieval.csv
    chunk_sources:
      - type: ragmeta
        index_version: rag-ingestion-v2-xlsx-candidate-v1
        metadata_only_text: true

  - name: PDF_CONTENT
    query_sources:
      - role: pdf_c7_conservative
        path: ai/eval/eval_queries/gold_queries_pdf_v0.csv
    chunk_sources:
      - type: ragmeta
        index_version: rag-ingestion-v2-pdf-candidate-v1

  - name: PDF_FILE_IDENTITY
    identity_only: true
    query_sources:
      - role: pdf_file_lookup_gold_positive_clean
        path: ai/eval/review/gold_silver_tuning/pdf_file_lookup_gold_positive_clean.csv
      - role: pdf_file_lookup_diagnostic_clean
        path: ai/eval/review/gold_silver_tuning/pdf_file_lookup_diagnostic_clean.csv
      - role: silver_pdf_file_lookup_positive_train
        path: ai/eval/review/gold_silver_tuning/silver_pdf_file_lookup_positive_train.csv
      - role: silver_pdf_file_lookup_hard_negative_v2
        path: ai/eval/review/gold_silver_tuning/silver_pdf_file_lookup_hard_negative_v2.csv

outputs:
  split_manifest_csv: ai/eval/review/retrieval_ood/retrieval_ood_split_manifest.csv
  split_report_json: ai/eval/reports/rag-ingestion/retrieval_ood_split_report.json
  split_report_md: ai/eval/reports/rag-ingestion/retrieval_ood_split_report.md
  interference_report_json: ai/eval/reports/rag-ingestion/vector_interference_diagnostic.json
  interference_report_md: ai/eval/reports/rag-ingestion/vector_interference_diagnostic.md
  interference_by_query_csv: ai/eval/reports/rag-ingestion/vector_interference_diagnostic_by_query.csv
