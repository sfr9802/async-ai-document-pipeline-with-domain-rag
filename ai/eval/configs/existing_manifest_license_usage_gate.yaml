schema_version: existing_manifest_license_usage_gate_config_v1
task: rag_existing_dataset_license_usage_gate_v1
mode: diagnostic_report_only
project_usage_profile: NONCOMMERCIAL_INTERNAL_RESEARCH_AND_DEVELOPMENT
description: >
  Enrich already-collected manifests with explicit license and usage-gate
  metadata for noncommercial internal OCR/MM and RAG experiments. This config
  is conservative: rows are not marked VERIFIED unless a row-level manifest
  field, source-family terms page, catalog metadata, or source-page proof is
  available. The outputs are companion review artifacts only.

inputs:
  discover_repo_manifests: true
  manifest_paths:
    - D:/_external_runtime_artifacts/async-ocr-rag-multimodal-pipeline/source_collection_20260510/manifest.csv
    - D:/_external_runtime_artifacts/async-ocr-rag-multimodal-pipeline/source_collection_20260510/manifest.json
  repo_manifest_globs:
    - "**/manifest.json"
    - "**/manifest.csv"
    - "**/manifest*.json"
    - "**/manifest*.csv"
    - "**/external_archive_manifest.json"
    - "**/external_archive_manifest.csv"
  exclude_path_contains:
    - "/.git/"
    - "/.pytest_cache/"
    - "/__pycache__/"
    - "/existing_manifest_license_enriched."
    - "/license_review_required_rows.csv"

network_verification:
  enabled: false
  max_source_page_checks: 30
  timeout_seconds: 4
  note: >
    Disabled for deterministic report generation. The script supports bounded
    source-page fetching, but this run relies on manifest metadata and explicit
    configured source-family evidence URLs. Rows without explicit evidence stay
    ambiguous or review-required.

