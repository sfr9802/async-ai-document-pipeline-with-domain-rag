schema_version: silver_only_tuning_config_v1
run_id: silver_only_pdf_file_lookup_hneg_v2_diagnostic_20260509

policy:
  official_denominator_registry: ai/eval/eval_queries/official_denominator_registry.json
  modify_official_denominator_registry: false
  train_on_frozen_gold: false
  tune_thresholds_on_frozen_gold: false
  evaluate_frozen_gold_after_tuning: true
  mutate_production_indexes: false
  broad_indexing: false
  pdf_file_lookup_policy: EXPECTED_FILE_NAME_OR_DOCUMENT_IDENTITY
  pdf_file_lookup_claims_page_bbox_table_row_column_value_success: false

input_silver_train_files:
  text_positive: ai/eval/review/gold_silver_tuning/silver_text_positive_train.csv
  text_hard_negative: ai/eval/review/gold_silver_tuning/silver_text_hard_negative_train.csv
  text_abstain_diagnostic: ai/eval/review/gold_silver_tuning/silver_text_abstain_diagnostic.csv
  pdf_file_lookup_positive: ai/eval/review/gold_silver_tuning/silver_pdf_file_lookup_positive_train.csv
  pdf_file_lookup_hard_negative: ai/eval/review/gold_silver_tuning/silver_pdf_file_lookup_hard_negative_v2.csv

frozen_gold_eval_files:
  text_main_positive: ai/eval/review/gold_silver_tuning/text_gold_main_positive_clean.csv
  text_abstain_diagnostic: ai/eval/review/gold_silver_tuning/text_gold_abstain_diagnostic_clean.csv
  pdf_file_lookup_positive: ai/eval/review/gold_silver_tuning/pdf_file_lookup_gold_positive_clean.csv
  pdf_file_lookup_diagnostic: ai/eval/review/gold_silver_tuning/pdf_file_lookup_diagnostic_clean.csv

corpora:
  text_rag_chunks_jsonl: ai/eval/corpora/namu-v4-structured-combined/rag_chunks.jsonl

leakage_guard_settings:
  denominator_manifest: ai/eval/reports/rag-ingestion/denominator_manifest.json
  require_silver_leakage_status: PASS
  require_query_overlap_count: 0
  require_query_id_overlap_count: 0
  require_source_query_id_overlap_count: 0
  require_expected_id_overlap_count: 0
  require_silver_official_gold_false: true
  require_frozen_gold_official_gold_false: true
  fail_before_tuning_on_guard_failure: true

tuning:
  mode: diagnostic_profile_selection
  selection_data: silver_only
  top_k: 10
  text_profiles:
    - name: baseline_text_title_section_bm25
      title_weight: 4
      alias_weight: 2
      section_weight: 2
      chunk_weight: 1
    - name: tuned_text_chunk_balanced_bm25
      title_weight: 3
      alias_weight: 2
      section_weight: 2
      chunk_weight: 2
    - name: tuned_text_section_boost_bm25
      title_weight: 4
      alias_weight: 2
      section_weight: 4
      chunk_weight: 1
  pdf_file_lookup_profiles:
    - name: baseline_pdf_file_identity_tokens
      lexical_weight: 1.0
      year_weight: 1.0
      month_weight: 1.0
      family_weight: 1.0
    - name: tuned_pdf_file_identity_metadata_boost
      lexical_weight: 1.0
      year_weight: 1.5
      month_weight: 1.5
      family_weight: 2.0
  objective:
    hit_at_10_weight: 0.45
    mrr_at_10_weight: 0.35
    recall_at_10_weight: 0.20
    hard_negative_confusion_penalty: 0.25

approved_xlsx_strict_wrapper:
  enabled_if_report_exists: true
  report_json: ai/eval/reports/rag-ingestion/xlsx_strict_silver_generation_20260507.json
  report_md: ai/eval/reports/rag-ingestion/xlsx_strict_silver_generation_20260507.md

output_report_paths:
  baseline_json: ai/eval/reports/rag-ingestion/silver_tuning_baseline_report_pdf_hneg_v2.json
  baseline_md: ai/eval/reports/rag-ingestion/silver_tuning_baseline_report_pdf_hneg_v2.md
  silver_tuning_run_json: ai/eval/reports/rag-ingestion/silver_tuning_run_report_pdf_hneg_v2.json
  silver_tuning_run_md: ai/eval/reports/rag-ingestion/silver_tuning_run_report_pdf_hneg_v2.md
  gold_eval_after_silver_tuning_json: ai/eval/reports/rag-ingestion/gold_eval_after_silver_tuning_report_pdf_hneg_v2.json
  gold_eval_after_silver_tuning_md: ai/eval/reports/rag-ingestion/gold_eval_after_silver_tuning_report_pdf_hneg_v2.md
  before_after_metric_delta_md: ai/eval/reports/rag-ingestion/before_after_metric_delta_pdf_hneg_v2.md
